<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>国旗クイズ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #12305a;
    color: #fff;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  .screen {
    display: none;
    position: fixed; inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vh 3vw;
    text-align: center;
  }
  .screen.active { display: flex; }

  h1 { font-size: 6vmin; margin: 0 0 1.5vh 0; letter-spacing: 0.05em; }
  h2 { font-size: 4vmin; margin: 0 0 2vh 0; }

  /* --- 縦向きのときは回転をうながす --- */
  #rotate-overlay {
    display: none;
    position: fixed; inset: 0;
    z-index: 9999;
    background: #0b1f3a;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vw;
  }
  #rotate-overlay .icon { font-size: 18vw; margin-bottom: 4vh; animation: rotate-hint 1.6s ease-in-out infinite; }
  #rotate-overlay p { font-size: 5.5vw; line-height: 1.6; }
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }
  @media (orientation: portrait) {
    #rotate-overlay { display: flex; }
    .screen.active { display: none !important; }
  }

  /* --- モード選択画面 --- */
  #screen-mode p { font-size: 2.4vmin; opacity: 0.85; margin: 0 0 3vh 0; }
  .mode-row {
    display: flex;
    gap: 4vw;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2vh;
    font-size: 3vmin;
    font-weight: bold;
    padding: 3.5vh 4vw;
    border-radius: 24px;
    border: none;
    background: #ffcc00;
    color: #12305a;
    box-shadow: 0 6px 0 #c99900;
    min-width: 28vw;
  }
  .mode-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99900; }
  .mode-icon { font-size: 9vmin; }

  /* --- ルール画面 --- */
  #screen-rules { justify-content: center; }
  .rules-box {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 2vh 2vw;
    max-width: 1400px;
    width: 100%;
  }
  .rules-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5vw;
  }
  .rule-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8vh;
    font-size: 2.1vmin;
    line-height: 1.6;
    text-align: center;
  }
  .rule-num {
    flex: none;
    font-size: 2.6vmin;
    font-weight: bold;
    background: #ffcc00;
    color: #12305a;
    border-radius: 50%;
    width: 1.9em;
    height: 1.9em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  ruby rt { font-size: 0.5em; color: #ffe27a; }

  .agree-row {
    display: flex;
    gap: 3vw;
    margin-top: 2.2vh;
    flex-wrap: wrap;
    justify-content: center;
  }
  .agree-btn {
    font-size: 2.6vmin;
    font-weight: bold;
    padding: 1.6vh 3vw;
    border-radius: 18px;
    border: 3px solid #fff;
    background: transparent;
    color: #fff;
    min-width: 24vw;
  }
  .agree-btn.agreed {
    background: #4caf50;
    border-color: #4caf50;
  }
  #go-start-wrap { margin-top: 2vh; display: none; }

  /* --- 共通ボタン --- */
  .btn {
    font-size: 3vmin;
    font-weight: bold;
    padding: 1.8vh 3.5vw;
    margin: 1vh;
    border-radius: 20px;
    border: none;
    background: #ffcc00;
    color: #12305a;
    box-shadow: 0 6px 0 #c99900;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99900; }
  .btn.secondary {
    background: transparent;
    color: #fff;
    border: 3px solid #fff;
    box-shadow: none;
  }
  .btn.secondary:active { transform: translateY(2px); }

  /* --- スタート画面 --- */
  #screen-start #mode-label { font-size: 2.6vmin; font-weight: bold; color: #ffe27a; margin: 0 0 1vh 0; }
  #screen-start p.hint { font-size: 2.2vmin; opacity: 0.8; margin: 0 0 3vh 0; }

  /* --- カウントダウン --- */
  #countdown-number {
    font-size: 52vh;
    font-weight: 900;
    line-height: 1;
    animation: pop 0.8s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* --- 国旗画面 --- */
  #screen-flag { flex-direction: column; padding: 1.5vh 2.5vw; gap: 1.2vh; }
  .flag-main { display: flex; flex-direction: row; gap: 4vw; flex: 1 1 0%; min-height: 0; width: 100%; align-items: stretch; }
  .flag-display { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1 1 0%; min-width: 0; height: 100%; }
  .flag-side { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 30%; }
  #flag-img {
    max-width: 100%;
    max-height: 100%;
    border: 5px solid #fff;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    background: #fff;
  }
  .reveal-text {
    font-size: 4.2vmin;
    font-weight: bold;
    margin: 0.6vh 0;
    color: #ffe27a;
    display: none;
  }
  .flag-buttons { display: flex; flex-direction: column; }
  .flag-buttons .btn { width: 100%; }

  /* モードごとの表示切り替え */
  .only-flag, .only-capital { display: none; }
  body.mode-flag .only-flag { display: block; }
  body.mode-capital .only-capital { display: block; }
</style>
</head>
<body>

  <!-- 縦向きのときの回転案内 -->
  <div id="rotate-overlay">
    <div class="icon">📱</div>
    <p>iPad を<br>よこむき にしてください</p>
  </div>

  <!-- モード選択画面 -->
  <div id="screen-mode" class="screen active">
    <h1>国旗クイズ</h1>
    <p>あそびたい クイズを えらんでね</p>
    <div class="mode-row">
      <button class="mode-btn" onclick="selectMode('flag')">
        <span class="mode-icon">🏳️</span>
        <span>国旗クイズ</span>
      </button>
      <button class="mode-btn" onclick="selectMode('capital')">
        <span class="mode-icon">🏛️</span>
        <span>国の首都あてクイズ</span>
      </button>
    </div>
  </div>

  <!-- ルール画面 -->
  <div id="screen-rules" class="screen">
    <h1>国旗クイズ</h1>
    <div class="rules-box">
      <div class="rules-grid">
        <div class="rule-item">
          <span class="rule-num">1</span>
          <span>
            <ruby>先<rt>さき</rt></ruby>に10<ruby>点<rt>てん</rt></ruby><ruby>取<rt>と</rt></ruby>った<ruby>人<rt>ひと</rt></ruby>の<ruby>勝<rt>か</rt></ruby>ち
          </span>
        </div>
        <div class="rule-item">
          <span class="rule-num">2</span>
          <span>
            <ruby>同時<rt>どうじ</rt></ruby>に<ruby>答<rt>こた</rt></ruby>えた<ruby>時<rt>とき</rt></ruby>はみんなが<ruby>合意<rt>ごうい</rt></ruby>すれば、<ruby>同時<rt>どうじ</rt></ruby>に<ruby>答<rt>こた</rt></ruby>えた<ruby>人<rt>ひと</rt></ruby><ruby>全員<rt>ぜんいん</rt></ruby>にポイント
          </span>
        </div>
        <div class="rule-item">
          <span class="rule-num">3</span>
          <span>
            スポーツマンシップに<ruby>則<rt>のっと</rt></ruby>ってプレーする
          </span>
        </div>
      </div>
    </div>

    <div class="agree-row">
      <button class="agree-btn" id="agree1" onclick="agree(1)">① どうい する</button>
      <button class="agree-btn" id="agree2" onclick="agree(2)">② どうい する</button>
    </div>

    <div id="go-start-wrap">
      <button class="btn" onclick="showScreen('screen-start')">つぎへ</button>
    </div>
  </div>

  <!-- スタート画面 -->
  <div id="screen-start" class="screen">
    <h1>国旗クイズ</h1>
    <p id="mode-label"></p>
    <p class="hint">「スタート」をおすと、もんだいが はじまるよ</p>
    <button class="btn" onclick="startCountdown()">スタート</button>
    <div>
      <button class="btn secondary" onclick="showScreen('screen-mode')">クイズを かえる</button>
      <button class="btn secondary" onclick="showScreen('screen-rules')">ルールにもどる</button>
    </div>
  </div>

  <!-- カウントダウン画面 -->
  <div id="screen-countdown" class="screen">
    <div id="countdown-number">3</div>
  </div>

  <!-- 国旗画面 -->
  <div id="screen-flag" class="screen">
    <div class="flag-main">
      <div class="flag-display">
        <img id="flag-img" src="" alt="国旗">
      </div>
      <div class="flag-side">
        <div id="reveal-country" class="reveal-text"></div>
        <div id="reveal-capital" class="reveal-text"></div>
        <div class="flag-buttons">
          <button class="btn only-flag" id="show-answer-btn" onclick="showCountryAnswer()">答えを見る</button>
          <button class="btn only-capital" id="show-country-btn" onclick="showCountryAnswer()">国名を見る</button>
          <button class="btn only-capital" id="show-capital-btn" onclick="showCapitalAnswer()">首都名を見る</button>
          <button class="btn" id="next-btn" onclick="startCountdown()">次の問題</button>
        </div>
      </div>
    </div>
  </div>

    ["tv","ツバル","フナフティ"],["nr","ナウル","ヤレン"],["pw","パラオ","マルキョク"],["fm","ミクロネシア連邦","パリキール"],["mh","マーシャル諸島","マジュロ"],

    ["cu","キューバ","ハバナ"],["jm","ジャマイカ","キングストン"],["ht","ハイチ","ポルトープランス"],["do","ドミニカ共和国","サントドミンゴ"],["bs","バハマ","ナッソー"],
    ["bb","バルバドス","ブリッジタウン"],["tt","トリニダード・トバゴ","ポートオブスペイン"],["lc","セントルシア","カストリーズ"],["vc","セントビンセント・グレナディーン","キングスタウン"],

    ["co","コロンビア","ボゴタ"],["ve","ベネズエラ","カラカス"],["gy","ガイアナ","ジョージタウン"],["sr","スリナム","パラマリボ"],["ec","エクアドル","キト"],
    ["pe","ペルー","リマ"],["br","ブラジル","ブラジリア"],["bo","ボリビア","ラパス"],["py","パラグアイ","アスンシオン"],["uy","ウルグアイ","モンテビデオ"],["ar","アルゼンチン","ブエノスアイレス"]
  ];

  let deck = [];
  let currentCountry = null;
  let agreed1 = false, agreed2 = false;
  let quizMode = "flag";

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function newDeck() { deck = shuffle(countries); }

  function nextCountry() {
    if (deck.length === 0) newDeck();
    currentCountry = deck.pop();
  }

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function selectMode(mode) {
    quizMode = mode;
    document.body.classList.remove("mode-flag", "mode-capital");
    document.body.classList.add("mode-" + mode);
    document.getElementById("mode-label").textContent =
      mode === "flag" ? "えらんだクイズ: 国旗クイズ" : "えらんだクイズ: 国の首都あてクイズ";
    showScreen("screen-rules");
  }

  function agree(n) {
    if (n === 1) {
      agreed1 = true;
      const b = document.getElementById("agree1");
      b.classList.add("agreed");
      b.textContent = "① どういした ✓";
    } else {
      agreed2 = true;
      const b = document.getElementById("agree2");
      b.classList.add("agreed");
      b.textContent = "② どういした ✓";
    }
    if (agreed1 && agreed2) {
      document.getElementById("go-start-wrap").style.display = "block";
    }
  }

  function startCountdown() {
    showScreen("screen-countdown");
    let count = 3;
    const el = document.getElementById("countdown-number");
    el.textContent = count;
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "pop 0.8s ease-out";
    const timer = setInterval(() => {
      count--;
      if (count > 0) {
        el.textContent = count;
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "pop 0.8s ease-out";
      } else {
        clearInterval(timer);
        showFlagScreen();
      }
    }, 800);
  }

  function showFlagScreen() {
    nextCountry();
    const img = document.getElementById("flag-img");
    img.src = `https://flagcdn.com/w640/${currentCountry[0]}.png`;
    img.alt = currentCountry[1];

    ["reveal-country", "reveal-capital"].forEach(id => {
      const el = document.getElementById(id);
      el.textContent = "";
      el.style.display = "none";
    });
    ["show-answer-btn", "show-country-btn", "show-capital-btn"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = "";
    });

    showScreen("screen-flag");
  }

  function showCountryAnswer() {
    const el = document.getElementById("reveal-country");
    el.textContent = currentCountry[1];
    el.style.display = "block";
    const a = document.getElementById("show-answer-btn");
    if (a) a.style.display = "none";
    const b = document.getElementById("show-country-btn");
    if (b) b.style.display = "none";
  }

  function showCapitalAnswer() {
    const el = document.getElementById("reveal-capital");
    el.textContent = currentCountry[2];
    el.style.display = "block";
    const b = document.getElementById("show-capital-btn");
    if (b) b.style.display = "none";
  }

  newDeck();
</script>
